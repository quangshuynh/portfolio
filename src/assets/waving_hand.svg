<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 120 120" width="100" height="100">
  <!-- Emoji -->
  <text x="40" y="80" font-size="70" text-anchor="middle">&#x1F44B;</text> <!-- Unicode for waving hand emoji -->

  <!-- Desktop animation; CSS provides a fallback for mobile browsers. -->
  <animateTransform attributeName="transform" type="rotate" values="0 30 30; 12 30 30; 6 30 30; 12 30 30; 0 30 30" dur="3s" repeatCount="indefinite"/>

</svg>
