<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = 'dark';

        try {
          theme = localStorage.getItem('portfolio-theme') || 'dark';
        } catch (error) {}

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.backgroundColor =
          theme === 'light' ? '#f1ede3' : '#101913';
      }());
    </script>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#101913"
    />

    <meta name="author" content="Quang Huynh" />

    <link
      rel="icon"
      href="%BASE_URL%favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      href="%BASE_URL%logo192.png"
    />

    <link
      rel="manifest"
      href="%BASE_URL%manifest.json"
    />

    <!--seo-head-->
  </head>

  <body>
    <noscript>
      This portfolio requires JavaScript to display its content.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/index.jsx"
    ></script>
  </body>
</html>
