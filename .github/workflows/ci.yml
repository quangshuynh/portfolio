name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Fails only when a pinned project image is definitely broken (4xx or not
      # an image); an unreachable CDN is reported as a warning.
      - name: Check remote project images
        run: npm run check:assets

      - name: Build
        run: npm run build
